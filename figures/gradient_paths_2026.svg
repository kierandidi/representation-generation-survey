<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">What end-to-end means in latent generative modeling</title>
  <desc id="desc">Five architectures are compared by modules, parameter sharing, gradient paths, and schedules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112b26"/><stop offset="1" stop-color="#1f4b40"/></linearGradient>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6dd3b8"/></marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffad7d"/></marker>
    <style>
      .title { font: 700 46px Georgia, serif; fill: #f7f2e8; }
      .sub { font: 22px 'Helvetica Neue', sans-serif; fill: #b8d0c8; }
      .row { font: 700 25px Georgia, serif; fill: #f7f2e8; }
      .box { font: 650 20px 'Helvetica Neue', sans-serif; fill: #112b26; }
      .note { font: 18px 'Helvetica Neue', sans-serif; fill: #c9dbd5; }
      .small { font: 16px 'Helvetica Neue', sans-serif; fill: #c9dbd5; }
    </style>
  </defs>
  <rect width="1600" height="920" rx="32" fill="url(#bg)"/>
  <text x="70" y="76" class="title">“End-to-end” is a gradient-path claim</text>
  <text x="72" y="116" class="sub">Parameter sharing, objective coupling, and training in one job are related, but not equivalent.</text>

  <g transform="translate(70 165)">
    <text y="46" class="row">REPA-E</text>
    <rect x="260" y="0" width="210" height="70" rx="16" fill="#f3d8c7"/><text x="365" y="43" class="box" text-anchor="middle">encoder + decoder</text>
    <rect x="610" y="0" width="210" height="70" rx="16" fill="#cce7df"/><text x="715" y="43" class="box" text-anchor="middle">denoiser</text>
    <rect x="960" y="0" width="220" height="70" rx="16" fill="#e8dba9"/><text x="1070" y="43" class="box" text-anchor="middle">external teacher</text>
    <path d="M610 52H470" stroke="#6dd3b8" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#arrowA)"/>
    <path d="M960 19H820M960 19H470" stroke="#ffad7d" stroke-width="5" marker-end="url(#arrowB)"/>
    <text x="1240" y="27" class="note">Diffusion gradient stopped;</text><text x="1240" y="54" class="note">alignment updates both sides.</text>
  </g>

  <g transform="translate(70 305)">
    <text y="46" class="row">Unified Latents</text>
    <rect x="260" y="0" width="210" height="70" rx="16" fill="#f3d8c7"/><text x="365" y="43" class="box" text-anchor="middle">encoder</text>
    <rect x="610" y="0" width="210" height="70" rx="16" fill="#cce7df"/><text x="715" y="43" class="box" text-anchor="middle">diffusion prior</text>
    <rect x="960" y="0" width="220" height="70" rx="16" fill="#e8dba9"/><text x="1070" y="43" class="box" text-anchor="middle">diffusion decoder</text>
    <path d="M610 35H470" stroke="#6dd3b8" stroke-width="5" marker-end="url(#arrowA)"/>
    <path d="M960 35H470" stroke="#ffad7d" stroke-width="5" marker-end="url(#arrowB)"/>
    <text x="1240" y="27" class="note">Rate-bounded co-training;</text><text x="1240" y="54" class="note">best prior retrained later.</text>
  </g>

  <g transform="translate(70 445)">
    <text y="46" class="row">UNITE</text>
    <rect x="260" y="0" width="560" height="70" rx="16" fill="#9ad2c3"/><text x="540" y="30" class="box" text-anchor="middle">one Generative Encoder, two modes</text><text x="540" y="55" class="small" text-anchor="middle" fill="#28493f">tokenize image / denoise registers</text>
    <rect x="960" y="0" width="220" height="70" rx="16" fill="#e8dba9"/><text x="1070" y="43" class="box" text-anchor="middle">pixel decoder</text>
    <path d="M960 35H820" stroke="#ffad7d" stroke-width="5" marker-end="url(#arrowB)"/>
    <text x="1240" y="27" class="note">Shared weights couple tasks;</text><text x="1240" y="54" class="note">clean-latent gradient stopped.</text>
  </g>

  <g transform="translate(70 585)">
    <text y="46" class="row">GenFirst</text>
    <rect x="260" y="0" width="210" height="70" rx="16" fill="#f3d8c7"/><text x="365" y="43" class="box" text-anchor="middle">stochastic VAE</text>
    <rect x="610" y="0" width="210" height="70" rx="16" fill="#cce7df"/><text x="715" y="43" class="box" text-anchor="middle">learned prior</text>
    <rect x="960" y="0" width="220" height="70" rx="16" fill="#e8dba9"/><text x="1070" y="43" class="box" text-anchor="middle">pixel decoder</text>
    <path d="M610 35H470" stroke="#6dd3b8" stroke-width="5" marker-end="url(#arrowA)"/>
    <path d="M960 35H470" stroke="#ffad7d" stroke-width="5" marker-end="url(#arrowB)"/>
    <text x="1240" y="20" class="note">Prior shapes encoder;</text><text x="1240" y="45" class="note">entropy prevents collapse;</text><text x="1240" y="70" class="note">generation pressure comes first.</text>
  </g>

  <g transform="translate(70 725)">
    <text y="46" class="row">Self-Flow</text>
    <rect x="260" y="0" width="560" height="70" rx="16" fill="#9ad2c3"/><text x="540" y="30" class="box" text-anchor="middle">student flow model + EMA teacher</text><text x="540" y="55" class="small" text-anchor="middle" fill="#28493f">mixed-noise tokens / cleaner tokens</text>
    <rect x="960" y="0" width="220" height="70" rx="16" fill="#e8dba9"/><text x="1070" y="43" class="box" text-anchor="middle">pixels / A-V-action</text>
    <path d="M820 35H960" stroke="#6dd3b8" stroke-width="5" marker-end="url(#arrowA)"/>
    <text x="1240" y="27" class="note">No external VFM;</text><text x="1240" y="54" class="note">internal feature prediction.</text>
  </g>

  <g transform="translate(70 865)">
    <path d="M0 0H70" stroke="#6dd3b8" stroke-width="5" marker-end="url(#arrowA)"/><text x="88" y="7" class="small">generative / prior gradient</text>
    <path d="M360 0H430" stroke="#ffad7d" stroke-width="5" marker-end="url(#arrowB)"/><text x="448" y="7" class="small">reconstruction or alignment gradient</text>
    <path d="M850 0H920" stroke="#6dd3b8" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#arrowA)"/><text x="938" y="7" class="small">stop-gradient boundary</text>
  </g>
</svg>
