<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">A two-axis taxonomy of representations for generation</title>
  <desc id="desc">Methods are organized by where representations enter the generative system and by how strongly representation and generation training are coupled.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0e8"/>
      <stop offset="1" stop-color="#e7efe9"/>
    </linearGradient>
    <style>
      .title { font: 700 48px Georgia, serif; fill: #17382f; }
      .subtitle { font: 24px 'Helvetica Neue', sans-serif; fill: #52665f; }
      .axis { font: 700 25px 'Helvetica Neue', sans-serif; fill: #17382f; letter-spacing: .04em; }
      .tick { font: 650 23px 'Helvetica Neue', sans-serif; fill: #29463e; }
      .cellhead { font: 700 22px Georgia, serif; fill: #17382f; }
      .pill { font: 600 18px 'Helvetica Neue', sans-serif; fill: #17382f; }
      .note { font: 15px 'Helvetica Neue', sans-serif; fill: #52665f; }
    </style>
  </defs>
  <rect width="1600" height="1000" rx="32" fill="url(#bg)"/>
  <circle cx="1460" cy="105" r="180" fill="#ef8354" opacity="0.10"/>
  <circle cx="130" cy="900" r="210" fill="#2d7f72" opacity="0.09"/>
  <text x="90" y="82" class="title">Representations for generation: the 2026 map</text>
  <text x="92" y="122" class="subtitle">Chronology explains when ideas appeared; these axes explain what is actually coupled.</text>

  <g transform="translate(245 190)">
    <rect width="1260" height="660" rx="22" fill="#fffdf8"/>
    <path d="M0 220H1260M0 440H1260M315 0V660M630 0V660M945 0V660" stroke="#bdd0c8" stroke-width="2"/>

    <rect x="0" y="0" width="315" height="220" fill="#eff6f2" rx="22"/>
    <rect x="315" y="0" width="315" height="220" fill="#f8f0e9"/>
    <rect x="630" y="0" width="315" height="220" fill="#eff6f2"/>
    <rect x="945" y="0" width="315" height="220" fill="#f8f0e9" rx="22"/>
    <rect x="0" y="440" width="315" height="220" fill="#f8f0e9" rx="22"/>
    <rect x="315" y="440" width="315" height="220" fill="#eff6f2"/>
    <rect x="630" y="440" width="315" height="220" fill="#f8f0e9"/>
    <rect x="945" y="440" width="315" height="220" fill="#eff6f2" rx="22"/>

    <g transform="translate(20 22)">
      <text class="cellhead">Denoiser features</text>
      <g transform="translate(0 42)">
        <rect width="86" height="34" rx="17" fill="#cfe7df"/><text x="43" y="23" class="pill" text-anchor="middle">REPA</text>
        <rect x="96" width="76" height="34" rx="17" fill="#cfe7df"/><text x="134" y="23" class="pill" text-anchor="middle">REG</text>
        <rect x="182" width="100" height="34" rx="17" fill="#cfe7df"/><text x="232" y="23" class="pill" text-anchor="middle">iREPA</text>
      </g>
      <g transform="translate(0 88)">
        <rect width="104" height="34" rx="17" fill="#cfe7df"/><text x="52" y="23" class="pill" text-anchor="middle">HASTE</text>
        <rect x="114" width="164" height="34" rx="17" fill="#cfe7df"/><text x="196" y="23" class="pill" text-anchor="middle">REPR-ALIGN</text>
      </g>
      <text y="152" class="note">External teacher; inference unchanged</text>
    </g>

    <g transform="translate(335 22)">
      <text class="cellhead">Tokenizer / VAE</text>
      <g transform="translate(0 42)">
        <rect width="112" height="34" rx="17" fill="#f7d7c8"/><text x="56" y="23" class="pill" text-anchor="middle">VA-VAE</text>
        <rect x="122" width="112" height="34" rx="17" fill="#f7d7c8"/><text x="178" y="23" class="pill" text-anchor="middle">AlignTok</text>
      </g>
      <g transform="translate(0 88)">
        <rect width="132" height="34" rx="17" fill="#f7d7c8"/><text x="66" y="23" class="pill" text-anchor="middle">Send-VAE</text>
        <rect x="142" width="116" height="34" rx="17" fill="#f7d7c8"/><text x="200" y="23" class="pill" text-anchor="middle">PS-VAE</text>
      </g>
      <text y="152" class="note">Reconstruction-first latent shaping</text>
    </g>

    <g transform="translate(650 22)">
      <text class="cellhead">Pretrained feature latent</text>
      <g transform="translate(0 42)">
        <rect width="76" height="34" rx="17" fill="#cfe7df"/><text x="38" y="23" class="pill" text-anchor="middle">RAE</text>
        <rect x="86" width="76" height="34" rx="17" fill="#cfe7df"/><text x="124" y="23" class="pill" text-anchor="middle">SVG</text>
        <rect x="172" width="76" height="34" rx="17" fill="#cfe7df"/><text x="210" y="23" class="pill" text-anchor="middle">FAE</text>
      </g>
      <g transform="translate(0 88)">
        <rect width="104" height="34" rx="17" fill="#cfe7df"/><text x="52" y="23" class="pill" text-anchor="middle">RAEv2</text>
        <rect x="114" width="100" height="34" rx="17" fill="#cfe7df"/><text x="164" y="23" class="pill" text-anchor="middle">LV-RAE</text>
        <rect x="224" width="62" height="34" rx="17" fill="#cfe7df"/><text x="255" y="23" class="pill" text-anchor="middle">RJF</text>
      </g>
      <text y="152" class="note">Reuse semantics; repair detail/geometry</text>
    </g>

    <g transform="translate(965 22)">
      <text class="cellhead">Native data / multimodal</text>
      <g transform="translate(0 42)">
        <rect width="84" height="34" rx="17" fill="#f7d7c8"/><text x="42" y="23" class="pill" text-anchor="middle">JiT</text>
        <rect x="94" width="116" height="34" rx="17" fill="#f7d7c8"/><text x="152" y="23" class="pill" text-anchor="middle">PixelDiT</text>
      </g>
      <g transform="translate(0 88)">
        <rect width="132" height="34" rx="17" fill="#f7d7c8"/><text x="66" y="23" class="pill" text-anchor="middle">SphereEnc</text>
      </g>
      <text y="152" class="note">No external semantic target</text>
    </g>

    <g transform="translate(20 242)">
      <text class="cellhead">Alignment curricula</text>
      <g transform="translate(0 42)">
        <rect width="150" height="34" rx="17" fill="#b9d9d0"/><text x="75" y="23" class="pill" text-anchor="middle">REPA / HASTE</text>
      </g>
      <text y="104" class="note">Teacher decays or turns off</text>
    </g>

    <g transform="translate(335 242)">
      <text class="cellhead">Staged adaptation</text>
      <g transform="translate(0 42)">
        <rect width="104" height="34" rx="17" fill="#f4c8b3"/><text x="52" y="23" class="pill" text-anchor="middle">AlignTok</text>
        <rect x="114" width="110" height="34" rx="17" fill="#f4c8b3"/><text x="169" y="23" class="pill" text-anchor="middle">REPA-E</text>
      </g>
      <text y="104" class="note">Selective gradients or phase changes</text>
    </g>

    <g transform="translate(650 242)">
      <text class="cellhead">Adapted representation</text>
      <g transform="translate(0 42)">
        <rect width="98" height="34" rx="17" fill="#b9d9d0"/><text x="49" y="23" class="pill" text-anchor="middle">RepTok</text>
        <rect x="108" width="94" height="34" rx="17" fill="#b9d9d0"/><text x="155" y="23" class="pill" text-anchor="middle">dRAE</text>
        <rect x="212" width="82" height="34" rx="17" fill="#b9d9d0"/><text x="253" y="23" class="pill" text-anchor="middle">IDEAL</text>
      </g>
      <text y="104" class="note">Preserve semantics while adding detail</text>
    </g>

    <g transform="translate(965 242)">
      <text class="cellhead">Ordered trajectories</text>
      <g transform="translate(0 42)">
        <rect width="164" height="34" rx="17" fill="#f4c8b3"/><text x="82" y="23" class="pill" text-anchor="middle">Latent Forcing</text>
      </g>
      <text y="104" class="note">Generate semantics before pixels</text>
    </g>

    <g transform="translate(20 462)">
      <text class="cellhead">Internal teacher</text>
      <g transform="translate(0 42)">
        <rect width="130" height="34" rx="17" fill="#7fb8a8"/><text x="65" y="23" class="pill" text-anchor="middle">Self-Flow</text>
        <rect x="140" width="70" height="34" rx="17" fill="#7fb8a8"/><text x="175" y="23" class="pill" text-anchor="middle">EPG</text>
      </g>
      <text y="104" class="note">EMA / native self-supervision</text>
    </g>

    <g transform="translate(335 462)">
      <text class="cellhead">Joint learned latent</text>
      <g transform="translate(0 42)">
        <rect width="92" height="34" rx="17" fill="#efae8f"/><text x="46" y="23" class="pill" text-anchor="middle">UNITE</text>
        <rect x="102" width="150" height="34" rx="17" fill="#efae8f"/><text x="177" y="23" class="pill" text-anchor="middle">Unified Latents</text>
      </g>
      <g transform="translate(0 88)">
        <rect width="118" height="34" rx="17" fill="#efae8f"/><text x="59" y="23" class="pill" text-anchor="middle">GenFirst</text>
        <rect x="128" width="84" height="34" rx="17" fill="#efae8f"/><text x="170" y="23" class="pill" text-anchor="middle">LDLM</text>
      </g>
      <text y="152" class="note">Different gradient paths; same slogan</text>
    </g>

    <g transform="translate(650 462)">
      <text class="cellhead">Shared visual tokens</text>
      <g transform="translate(0 42)">
        <rect width="90" height="34" rx="17" fill="#7fb8a8"/><text x="45" y="23" class="pill" text-anchor="middle">UniAR</text>
      </g>
      <text y="104" class="note">Understanding and generation interface</text>
    </g>

    <g transform="translate(965 462)">
      <text class="cellhead">Unified backbone</text>
      <g transform="translate(0 42)">
        <rect width="112" height="34" rx="17" fill="#efae8f"/><text x="56" y="23" class="pill" text-anchor="middle">FLUX.3</text>
        <rect x="122" width="106" height="34" rx="17" fill="#efae8f"/><text x="175" y="23" class="pill" text-anchor="middle">Self-Flow</text>
      </g>
      <text y="104" class="note">Images, video, audio, action</text>
    </g>
  </g>

  <text x="875" y="905" class="axis" text-anchor="middle">WHERE THE REPRESENTATION ENTERS</text>
  <path d="M255 880H1490" stroke="#17382f" stroke-width="3"/>
  <text x="70" y="528" class="axis" text-anchor="middle" transform="rotate(-90 70 528)">TRAINING COUPLING</text>
  <text x="210" y="300" class="tick" text-anchor="end">Frozen</text>
  <text x="210" y="520" class="tick" text-anchor="end">Staged</text>
  <text x="210" y="740" class="tick" text-anchor="end">Joint</text>
  <text x="245" y="952" class="note">Figure: Kieran Didi, CC BY 4.0. Placement denotes the dominant mechanism, not every implementation detail.</text>
</svg>
